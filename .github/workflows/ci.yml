name: Kindora PHP Syntax Checker

on:
  push:
    branches: [main, DevOps]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  php-lint:
    name: Check PHP Syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Check PHP Syntax
        run: |
          set -e

          mapfile -d '' php_files < <(
            find . -type f -name '*.php' \
            -not -path './.git/*' \
            -not -path './vendor/*' \
            -print0
          )

          if [ "${#php_files[@]}" -eq 0 ]; then
            echo "Tidak ada file PHP yang ditemukan."
            exit 1
          fi

          for file in "${php_files[@]}"; do
            echo "Memeriksa: $file"
            php -l "$file"
          done

          echo "Semua file PHP lolos pemeriksaan sintaks."